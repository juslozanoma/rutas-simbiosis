<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Bike</title>
<style>
:root { --teal-500: #2f7a6b; }
body { display: grid; place-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
.spinner-bike { display: block; width: 150px; height: auto; }
.spinner-bike_body,.spinner-bike_front,.spinner-bike_handlebars,.spinner-bike_pedals,.spinner-bike_pedals-spin,.spinner-bike_seat,.spinner-bike_spokes,.spinner-bike_spokes-spin,.spinner-bike_tire { animation: bikeBody 3s ease-in-out infinite; stroke: var(--teal-500); }
.spinner-bike_front { animation-name: bikeFront; }
.spinner-bike_handlebars { animation-name: bikeHandlebars; }
.spinner-bike_pedals { animation-name: bikePedals; }
.spinner-bike_pedals-spin { animation-name: bikePedalsSpin; }
.spinner-bike_seat { animation-name: bikeSeat; }
.spinner-bike_spokes,.spinner-bike_tire { stroke: currentColor; }
.spinner-bike_spokes { animation-name: bikeSpokes; }
.spinner-bike_spokes-spin { animation-name: bikeSpokesSpin; }
.spinner-bike_tire { animation-name: bikeTire; }
@keyframes bikeBody { from { stroke-dashoffset: 79; } 33%, 67% { stroke-dashoffset: 0; } to { stroke-dashoffset: -79; } }
@keyframes bikeFront { from { stroke-dashoffset: 19; } 33%, 67% { stroke-dashoffset: 0; } to { stroke-dashoffset: -19; } }
@keyframes bikeHandlebars { from { stroke-dashoffset: 10; } 33%, 67% { stroke-dashoffset: 0; } to { stroke-dashoffset: -10; } }
@keyframes bikePedals { from { animation-timing-function: ease-in; stroke-dashoffset: -25.133; } 33%, 67% { animation-timing-function: ease-out; stroke-dashoffset: -21.991; } to { stroke-dashoffset: -25.133; } }
@keyframes bikePedalsSpin { from { transform: rotate(0.1875turn); } to { transform: rotate(3.1875turn); } }
@keyframes bikeSeat { from { stroke-dashoffset: 5; } 33%, 67% { stroke-dashoffset: 0; } to { stroke-dashoffset: -5; } }
@keyframes bikeSpokes { from { animation-timing-function: ease-in; stroke-dashoffset: -31.416; } 33%, 67% { animation-timing-function: ease-out; stroke-dashoffset: -23.562; } to { stroke-dashoffset: -31.416; } }
@keyframes bikeSpokesSpin { from { transform: rotate(0); } to { transform: rotate(3turn); } }
@keyframes bikeTire { from { animation-timing-function: ease-in; stroke-dashoffset: 56.549; transform: rotate(0); } 33% { stroke-dashoffset: 0; transform: rotate(0.33turn); } 67% { animation-timing-function: ease-out; stroke-dashoffset: 0; transform: rotate(0.67turn); } to { stroke-dashoffset: -56.549; transform: rotate(1turn); } }
</style>
</head>
<body>
<svg class="spinner-bike" viewBox="0 0 48 30" width="48px" height="30px">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1">
    <g transform="translate(9.5,19)">
      <circle class="spinner-bike_tire" r="9" stroke-dasharray="56.549 56.549"></circle>
      <g class="spinner-bike_spokes-spin" stroke-dasharray="31.416 31.416" stroke-dashoffset="-23.562">
        <circle class="spinner-bike_spokes" r="5"></circle>
        <circle class="spinner-bike_spokes" r="5" transform="rotate(180,0,0)"></circle>
      </g>
    </g>
    <g transform="translate(24,19)">
      <g class="spinner-bike_pedals-spin" stroke-dasharray="25.133 25.133" stroke-dashoffset="-21.991" transform="rotate(67.5,0,0)">
        <circle class="spinner-bike_pedals" r="4"></circle>
        <circle class="spinner-bike_pedals" r="4" transform="rotate(180,0,0)"></circle>
      </g>
    </g>
    <g transform="translate(38.5,19)">
      <circle class="spinner-bike_tire" r="9" stroke-dasharray="56.549 56.549"></circle>
      <g class="spinner-bike_spokes-spin" stroke-dasharray="31.416 31.416" stroke-dashoffset="-23.562">
        <circle class="spinner-bike_spokes" r="5"></circle>
        <circle class="spinner-bike_spokes" r="5" transform="rotate(180,0,0)"></circle>
      </g>
    </g>
    <polyline class="spinner-bike_seat" points="14 3,18 3" stroke-dasharray="5 5"></polyline>
    <polyline class="spinner-bike_body" points="16 3,24 19,9.5 19,18 8,34 7,24 19" stroke-dasharray="79 79"></polyline>
    <path class="spinner-bike_handlebars" d="m30,2h6s1,0,1,1-1,1-1,1" stroke-dasharray="10 10"></path>
    <polyline class="spinner-bike_front" points="32.5 2,38.5 19" stroke-dasharray="19 19"></polyline>
  </g>
</svg>
</body>
</html>
