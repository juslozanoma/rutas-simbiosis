<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Pacman</title>
<style>
:root { --teal-500: #2f7a6b; }
body { display: grid; place-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
.spinner-pacman { position: relative; width: 300px; height: 130px; }
.spinner-pacman_circle { position: relative; left: -100px; width: 0; height: 0; border: 50px solid #FDD835; border-radius: 50%; border-right-color: transparent; animation: pacmanMove 5s linear 0s infinite normal forwards; }
.spinner-pacman_circle:before { content: ""; position: absolute; top: -50px; left: -50px; width: 0; height: 0; border: 50px solid #FDD835; border-radius: 50%; border-right-color: transparent; animation: pacmanChomp1 .25s ease-in-out 0s infinite normal forwards; }
.spinner-pacman_circle:after { content: ""; position: absolute; top: -50px; left: -50px; width: 0; height: 0; border: 50px solid #FDD835; border-radius: 50%; border-right-color: transparent; animation: pacmanChomp2 .25s ease-in-out 0s infinite normal forwards; }
.spinner-pacman_loader { position: relative; top: 50px; width: 300px; height: 0px; border-top: 10px dotted black; animation: pacmanLine 5s ease-in-out 0s infinite normal forwards; }
.spinner-pacman_dots { position: relative; top: 60px; display: flex; justify-content: center; align-items: center; }
.spinner-pacman_dot { position: relative; width: 10px; height: 10px; margin: 0 10px; border-radius: 50%; background: #1E88E5; animation: pacmanDot1 5s linear 0s infinite none normal; }
.spinner-pacman_dot:nth-child(1) { animation-delay: 0s }
.spinner-pacman_dot:nth-child(2) { animation-delay: 0.25s }
.spinner-pacman_dot:nth-child(3) { animation-delay: 0.5s }
.spinner-pacman_dot:nth-child(4) { animation-delay: 0.75s }
.spinner-pacman_dot:nth-child(5) { animation-delay: 1s }
.spinner-pacman_dot:nth-child(6) { animation-delay: 1.25s }
.spinner-pacman_dot:nth-child(7) { animation-delay: 1.5s }
.spinner-pacman_dot:nth-child(8) { animation-delay: 1.75s }
.spinner-pacman_dot:nth-child(9) { animation-delay: 1.9s }
.spinner-pacman_dot:nth-child(10) { animation-delay: 2.1s }
.spinner-pacman_dots2 { position: relative; top: 50px; left: 10px; display: flex; justify-content: center; align-items: center; }
.spinner-pacman_dot2 { position: relative; left: -10px; width: 10px; height: 10px; margin: 0 10px; border-radius: 50%; background: #F44336; opacity: 0; animation: pacmanDot2 5s linear 0s infinite none normal; }
.spinner-pacman_dot2:nth-child(10) { animation-delay: 2.5s }
.spinner-pacman_dot2:nth-child(9) { animation-delay: 2.75s }
.spinner-pacman_dot2:nth-child(8) { animation-delay: 3.0s }
.spinner-pacman_dot2:nth-child(7) { animation-delay: 3.25s }
.spinner-pacman_dot2:nth-child(6) { animation-delay: 3.5s }
.spinner-pacman_dot2:nth-child(5) { animation-delay: 3.75s }
.spinner-pacman_dot2:nth-child(4) { animation-delay: 4.0s }
.spinner-pacman_dot2:nth-child(3) { animation-delay: 4.25s }
.spinner-pacman_dot2:nth-child(2) { animation-delay: 4.5s }
.spinner-pacman_dot2:nth-child(1) { animation-delay: 4.6s }
@keyframes pacmanChomp1 { 0% { transform: rotate(0deg); } 50% { transform: rotate(45deg); } 100% { transform: rotate(0deg); } }
@keyframes pacmanChomp2 { 0% { transform: rotate(0deg); } 50% { transform: rotate(-45deg); } 100% { transform: rotate(0deg); } }
@keyframes pacmanMove { 0%, 100% { left: -100px; } 0%, 48% { transform: rotateY(0deg); } 50%, 100% { transform: rotateY(180deg); } 50% { left: 100%; } }
@keyframes pacmanLine { 0%, 100% { border-top: 10px dotted #1E88E5; } 0%, 48% { border-top: 10px dotted #1E88E5; } 50%, 100% { border-top: 10px dotted #F44336; } 50% { border-top: 10px dotted #F44336; } }
@keyframes pacmanDot1 { 0%,4% { background: #1E88E5; opacity: 1; } 5%,94% { background: #F44336; opacity: 0; } 95%,100% { background: #1E88E5; opacity: 1; } }
@keyframes pacmanDot2 { 0%,4% { background: #F44336; opacity: 1; } 5%,94% { opacity: 0; } 95%,100% { background: #F44336; opacity: 1; } }
</style>
</head>
<body>
<div class="spinner-pacman">
  <div class="spinner-pacman_dots">
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
    <div class="spinner-pacman_dot"></div>
  </div>
  <div class="spinner-pacman_dots2">
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
    <div class="spinner-pacman_dot2"></div>
  </div>
  <div class="spinner-pacman_circle"></div>
</div>
</body>
</html>
