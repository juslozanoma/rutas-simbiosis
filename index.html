<div id="app" class="app-shell" data-mobile-tab="ruta" data-mobile-panel="expanded">

  <!-- Raíz de React: aquí se monta la cáscara completa de la app (mapa, panel
       lateral, barra móvil, diálogos y selector de transporte). #app se
       conserva estático porque la lógica vanilla togglea sus atributos de
       datos (data-mobile-tab, data-mobile-panel) y clases (#app.combo-enfocado,

  <div id="simbiosis-root"></div>

</div>

<!-- React: módulo que monta la cáscara de la app. Va ANTES que los scripts
     clásicos (con defer) para que el DOM esté presente de forma síncrona

     sustituye por el bundle de producción en el build. -->

<!-- Lógica de la app: scripts clásicos (ámbito global compartido). Vite los
     copia tal cual (publicDir incluye js/) y conserva el orden. Van con defer
     para correr tras el montaje síncrono de React (el módulo va antes). -->
