<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutas &amp; Destinos — Planificador turístico de Colombia</title>
<meta name="description" content="Calcula la ruta en automóvil entre dos municipios de Colombia y descubre los sitios turísticos cercanos al recorrido.">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Leaflet MarkerCluster (rendimiento con miles de marcadores) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Turf.js (análisis espacial) -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app-shell" data-mobile-view="split">

  <!-- ============ MAPA A PANTALLA COMPLETA ============ -->
  <main class="map-full">
    <div id="map" role="application" aria-label="Mapa interactivo de la ruta y los sitios turísticos"></div>
  </main>

  <!-- ============ PANEL LATERAL FIJO ============ -->
  <aside class="side-panel">

    <!-- Resumen: distancia total y tiempo estimado -->
    <section class="panel-summary" id="panel-summary">
      <div class="stat">
        <span class="stat__label">Distancia</span>
        <span class="stat__value mono" id="stat-distancia">—</span>
      </div>
      <div class="stat">
        <span class="stat__label">Tiempo estimado</span>
        <span class="stat__value mono" id="stat-tiempo">—</span>
      </div>
      <div class="panel-summary__toggle" id="mobile-view-toggle">
        <button type="button" id="btn-mobile-collapse" class="mobile-toggle-btn" title="Ver mapa completo" aria-label="Ver el mapa a pantalla completa" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button type="button" id="btn-mobile-expand" class="mobile-toggle-btn" title="Ver panel completo" aria-label="Ver el panel a pantalla completa" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- Origen / destino + escalas + botón calcular -->
    <section class="panel-locate">
      <div class="panel-locate__row">
        <div class="combo" data-combo="origen">
          <button type="button" class="combo__trigger" id="origen-input" aria-label="Seleccionar municipio de origen">
            <span class="combo__trigger-text" data-placeholder="true">Origen</span>
            <svg class="combo__chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="combo__list" id="origen-list" role="listbox" hidden></ul>
        </div>
        <button type="button" id="btn-agregar-escala" class="icon-btn" title="Agregar pueblo intermedio" aria-label="Agregar pueblo intermedio">
          <svg class="icon-btn__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="panel-locate__escalas" id="panel-escalas"></div>
      <div class="panel-locate__row">
        <div class="combo" data-combo="destino">
          <button type="button" class="combo__trigger" id="destino-input" aria-label="Seleccionar municipio de destino">
            <span class="combo__trigger-text" data-placeholder="true">Destino</span>
            <svg class="combo__chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="combo__list" id="destino-list" role="listbox" hidden></ul>
        </div>
        <button type="button" id="btn-calcular" class="icon-btn icon-btn--accent" title="Calcular ruta" aria-label="Calcular ruta" disabled>
          <svg class="icon-btn__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="icon-btn__spinner" aria-hidden="true"></span>
        </button>
      </div>
      <button type="button" id="btn-mostrar-sitios" class="btn-mostrar-sitios-cercanos" disabled>Mostrar sitios turísticos cercanos</button>
    </section>

    <!-- Paradas agregadas a la ruta -->
    <section class="panel-paradas" id="panel-paradas" hidden>
      <h2 class="panel-paradas__title">Paradas <span class="badge-count mono" id="paradas-contador">0</span></h2>
      <ul class="paradas-lista" id="paradas-lista"></ul>
    </section>

    <section class="panel-sites" id="panel-sites" hidden>
      <h2 class="panel-sites__title">
        Sitios turísticos
        <span class="badge-count mono" id="sitios-contador">0</span>
        <button type="button" id="btn-categorias" class="btn-categorias" title="Filtrar por categorías">Categorías</button>
        <button type="button" id="btn-toggle-sitios" class="btn-toggle-sitios" title="Mostrar/ocultar sitios en el mapa" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </h2>
      <div class="filter-row">
        <input type="checkbox" id="check-distancia" class="filter-row__check">
        <div class="filter-row__field">
          <label for="filtro-distancia">
            <span>Distancia máxima a la ruta</span>
            <span class="filter-row__value mono" id="filtro-distancia-valor">10 km</span>
          </label>
          <input type="range" id="filtro-distancia" min="1" max="60" value="10" step="1" disabled>
        </div>
        <button type="button" id="btn-aplicar-distancia" class="icon-btn" title="Aplicar filtro de distancia" aria-label="Aplicar filtro de distancia" disabled>
          <svg class="icon-btn__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          <span class="icon-btn__spinner" aria-hidden="true"></span>
        </button>
      </div>
      <div class="filter-row">
        <input type="checkbox" id="check-tiempo" class="filter-row__check">
        <div class="filter-row__field">
          <label for="filtro-tiempo">
            <span>Desvío máximo estimado</span>
            <span class="filter-row__value mono" id="filtro-tiempo-valor">20 min</span>
          </label>
          <input type="range" id="filtro-tiempo" min="1" max="120" value="20" step="1" disabled>
        </div>
        <button type="button" id="btn-aplicar-tiempo" class="icon-btn" title="Aplicar filtro de tiempo" aria-label="Aplicar filtro de tiempo" disabled>
          <svg class="icon-btn__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          <span class="icon-btn__spinner" aria-hidden="true"></span>
        </button>
      </div>
      <div class="panel-categorias" id="panel-categorias" hidden>
        <div class="panel-categorias__header">
          <span class="panel-categorias__title">Categorías</span>
          <button type="button" id="btn-categorias-cerrar" class="panel-categorias__close" aria-label="Cerrar" title="Cerrar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="panel-categorias__grid" id="categorias-grid"></div>
      </div>
      <div class="panel-sites__scroll">
        <p class="empty-state" id="sitios-vacio">Activa un filtro y pulsa el botón de aplicar para ver los sitios turísticos cercanos.</p>
        <ul class="sitios-lista" id="sitios-lista" hidden></ul>
      </div>
    </section>

  </aside>
</div>

<!-- Plantilla de popup de sitio turístico -->
<template id="tpl-popup-sitio">
  <div class="popup-sitio">
    <span class="popup-sitio__cat"></span>
    <h3 class="popup-sitio__nombre"></h3>
    <p class="popup-sitio__ubicacion"></p>
    <p class="popup-sitio__desc"></p>
    <p class="popup-sitio__dist mono"></p>
    <button type="button" class="popup-sitio__add" title="Agregar a la ruta">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Agregar a la ruta
    </button>
  </div>
</template>

<script src="js/utils.js"></script>
<script src="js/map.js"></script>
<script src="js/routing.js"></script>
<script src="js/tourism.js"></script>
<script src="js/filters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
